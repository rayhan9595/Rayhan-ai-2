name: Build and distribute

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Rayhan ai APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Unzip Project File
        run: |
          unzip "Jarvis_AI_Fixed_Project 3.zip" -d extracted_project
          PROJECT_ROOT=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_PATH=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_ROOT"

      - name: Fix and Recreate pubspec.yaml
        run: |
          cd "$PROJECT_PATH"
          rm -f pubspec.yaml
          cat << 'EOF' > pubspec.yaml
          name: self_aware_automation
          description: "A new Flutter project for Jarvis AI."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            flutter_bloc: ^8.1.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

      - name: Fix Android v1 Embedding to v2 Embedding
        run: |
          cd "$PROJECT_PATH"
          
          # ১. AndroidManifest.xml আপডেট
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<\/activity>/i \        <meta-data android:name="flutterEmbedding" android:value="2" \/>' "$MANIFEST_PATH"
            echo "AndroidManifest.xml updated for v2 embedding."
          fi
          
          # ২. MainActivity.kt আপডেট
          MAIN_ACTIVITY_PATH=$(find android/app/src/main -name "MainActivity.kt")
          if [ -f "$MAIN_ACTIVITY_PATH" ]; then
            cat << 'EOF' > "$MAIN_ACTIVITY_PATH"
            package com.jarvis.self_aware_automation

            import io.flutter.embedding.android.FlutterActivity

            class MainActivity: FlutterActivity() {
            }
            EOF
            echo "MainActivity.kt fixed and rewritten for v2 embedding."
          fi

      - name: Install Dependencies
        run: |
          cd "$PROJECT_PATH"
          flutter pub get

      - name: Build Android App
        run: |
          cd "$PROJECT_PATH"
          flutter build apk --release

      - name: Rename APK to Rayhan ai
        run: |
          cd "$PROJECT_PATH"
          mkdir -p build/app/outputs/flutter-apk/
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rayhan_ai_2.apk || true

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-ai-2.APK
          path: extracted_project/**/build/app/outputs/flutter-apk/Rayhan_ai_2.apk
