name: Rayhan AI - Auto Unzip & Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Unzip & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ১. গিটহাব রিপোজিটরি থেকে জিপ ফাইল নেওয়া
      - uses: actions/checkout@v4

      # ২. জিপ ফাইল আনজিপ করা
      - name: Decompress Project Zip
        run: |
          unzip -o Jarvis_AI_Final_Fixed3.zip
          if [ -d "jarvis_project" ]; then
            mv jarvis_project/* .
            mv jarvis_project/.[!.]* . 2>/dev/null || true
          fi

      # ৩. জাভা সেটআপ (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৪. ফ্লাটার সেটআপ (ভার্সন লক)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # 🛠️ ৫. প্লাগইন এরর এড়ানোর জন্য অ্যান্ড্রয়েড এক্স এবং গ্রেডল প্রোপার্টিজ ফোর্স করা
      - name: Force AndroidX Compatibility
        run: |
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      # ৬. ডিপেন্ডেন্সি ডাউনলোড
      - name: Install dependencies
        run: |
          flutter pub cache clean -f
          flutter pub get

      # 🚀 ৭. অ্যান্ড্রয়েড রিলিজ APK বিল্ড করা (প্লাগইন এরর বাইপাস করার জন্য ফ্ল্যাগসহ)
      - name: Build release APK
        run: flutter build apk --release --split-per-abi --no-shrink

      # 📦 ৮. ফাইনাল APK আপলোড
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-AI-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
