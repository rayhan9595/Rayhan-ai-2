name: Rayhan AI - Auto Unzip & Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Unzip & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ১. গিটহাব রিপোজিটরি থেকে জিপ ফাইল নেওয়া
      - uses: actions/checkout@v4

      # ২. জিপ ফাইল আনজিপ করা
      - name: Decompress Project Zip
        run: |
          unzip -o Jarvis_AI_Final_Fixed3.zip
          if [ -d "jarvis_project" ]; then
            mv jarvis_project/* .
            mv jarvis_project/.[!.]* . 2>/dev/null || true
          fi
          ls -la

      # ৩. জাভা সেটআপ (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 🛠️ ৪. ফ্লাটার সেটআপ (ভার্সন লক করা হয়েছে যেন গ্রেডল এরর না আসে)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0' # আপনার প্রজেক্টের গ্রেডল ফাইলের সাথে সামঞ্জস্যপূর্ণ ভার্সন
          channel: 'stable'

      # ৫. ডিপেন্ডেন্সি ডাউনলোড
      - name: Install dependencies
        run: |
          flutter pub cache clean -f
          flutter pub get

      # ৬. অ্যান্ড্রয়েড রিলিজ APK বিল্ড করা
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # 📦 ७. ফাইনাল APK আপলোড
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-AI-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
