name: Build Max AI APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        cache: gradle

    - name: Unzip Upgraded Project
      run: |
        echo "📦 Unzipping Jarvis_Sentinel_V4_Upgraded.zip..."
        unzip -o Jarvis_Sentinel_V4_Upgraded.zip -d extracted_project
        cd extracted_project
        
        # অ্যাপের নাম পরিবর্তন করে "Max AI" করা
        echo "🏷️ Changing App Name to Max AI..."
        find . -name "strings.xml" -exec sed -i 's/Jarvis/Max AI/g' {} +
        find . -name "strings.xml" -exec sed -i 's/Jarvis-Ai/Max AI/g' {} +

    - name: Grant Execute Permission to Gradlew
      run: |
        cd extracted_project
        if [ -f gradlew ]; then
          chmod +x gradlew
        else
          echo "❌ gradlew not found in root, searching subdirectories..."
          cd android && chmod +x gradlew || true
        fi

    - name: Build Debug APK with Gradle
      run: |
        cd extracted_project
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        else
          cd android && ./gradlew assembleDebug --stacktrace
        fi

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Max-AI-Debug-APK
        path: |
          extracted_project/app/build/outputs/apk/debug/*.apk
          extracted_project/android/app/build/outputs/apk/debug/*.apk
