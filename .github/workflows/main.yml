name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Unzip project
        run: |
          unzip -o "Jarvis_AI_Fixed_Project_3_Updated.zip" -d extracted_project
          # প্রজেক্ট রুট ফোল্ডারটি খুঁজে বের করে একটি এনভায়রনমেন্ট ভেরিয়েবলে সেভ করা
          REAL_ROOT=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_ROOT=$REAL_ROOT" >> $GITHUB_ENV
          echo "Found project root at: $REAL_ROOT"

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          flutter build apk --release

      - name: Rename and Move APK
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p ../../output_apk/
          cp build/app/outputs/flutter-apk/app-release.apk ../../output_apk/Rayhan_ai_2.apk
          echo "APK successfully copied and renamed!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan_ai_2_APK
          path: output_apk/Rayhan_ai_2.apk
          if-no-files-found: error
