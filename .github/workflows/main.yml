name: Build and distribute

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Rayhan ai APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Unzip Project File
        run: |
          unzip "Jarvis_AI_Complete_Project 2 .zip" -d extracted_project
          # প্রজেক্ট রুট ফোল্ডারটি খুঁজে বের করে একটি এনভায়রনমেন্ট ভেরিয়েবলে সেভ করা
          PROJECT_ROOT=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_PATH=$PROJECT_ROOT" >> $GITHUB_ENV
          echo "Project found at: $PROJECT_ROOT"

      - name: Fix and Recreate pubspec.yaml
        run: |
          cd "$PROJECT_PATH"
          # পুরোনো বা খালি ফাইলটি মুছে ফেলা হচ্ছে
          rm -f pubspec.yaml
          
          # একটি সম্পূর্ণ নতুন এবং সঠিক ফরম্যাটের pubspec.yaml তৈরি করা হচ্ছে
          cat << 'EOF' > pubspec.yaml
          name: self_aware_automation
          description: "A new Flutter project for Jarvis AI."
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.0.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            cupertino_icons: ^1.0.6
            flutter_bloc: ^8.1.3

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF
          
          echo "New pubspec.yaml created successfully!"
          cat pubspec.yaml

      - name: Install Dependencies
        run: |
          cd "$PROJECT_PATH"
          flutter pub get

      - name: Build Android App
        run: |
          cd "$PROJECT_PATH"
          flutter build apk --release

      - name: Rename APK to Rayhan ai
        run: |
          cd "$PROJECT_PATH"
          mkdir -p build/app/outputs/flutter-apk/
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rayhan_ai_2.apk || true

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-ai-2.APK
          path: extracted_project/**/build/app/outputs/flutter-apk/Rayhan_ai_2.apk
