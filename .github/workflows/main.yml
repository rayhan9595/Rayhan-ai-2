name: Build Max AI APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 1. Checkout Repository
      uses: actions/checkout@v4

    - name: 📦 2. Unzip & View Files (লাইভ ট্র্যাকিং)
      run: |
        echo "=================================================="
        echo "📂 জিপ ফাইল আনজিপ করা শুরু হচ্ছে..."
        echo "=================================================="
        
        # জিপ ফাইল আনজিপ করা
        unzip -o Jarvis_Sentinel_V4_Upgraded.zip -d extracted_project
        
        echo "🔍 আনজিপ হওয়া ফোল্ডারের ভেতরের স্ট্রাকচার পরীক্ষা করা হচ্ছে:"
        ls -la extracted_project/
        
        # সঠিক ডিরেক্টরি চেক করে ফাইল মেইন রাস্তায় আনা
        if [ -d "extracted_project/Jarvis-Ai" ]; then
          echo "📁 Jarvis-Ai ফোল্ডার পাওয়া গেছে! ফাইল মুভ করা হচ্ছে..."
          mv extracted_project/Jarvis-Ai/* .
          mv extracted_project/Jarvis-Ai/.[!.]* . 2>/dev/null || true
        elif [ -d "extracted_project/Jarvis-Ai-main" ]; then
          echo "📁 Jarvis-Ai-main ফোল্ডার পাওয়া গেছে! ফাইল মুভ করা হচ্ছে..."
          mv extracted_project/Jarvis-Ai-main/* .
          mv extracted_project/Jarvis-Ai-main/.[!.]* . 2>/dev/null || true
        else
          echo "📁 সরাসরি ফাইলগুলো রুট ডিরেক্টরিতে মুভ করা হচ্ছে..."
          mv extracted_project/* .
          mv extracted_project/.[!.]* . 2>/dev/null || true
        fi
        rm -rf extracted_project
        
        echo "=================================================="
        echo "✅ রুট ডিরেক্টরির বর্তমান ফাইল লিস্ট:"
        echo "=================================================="
        ls -la

    - name: 🏷️ 3. Change App Name to Max AI
      run: |
        echo "🔄 অ্যাপের নাম 'Jarvis' থেকে বদলে 'Max AI' করা হচ্ছে..."
        find . -name "strings.xml" -exec sed -i 's/Jarvis/Max AI/g' {} +
        find . -name "strings.xml" -exec sed -i 's/Jarvis-Ai/Max AI/g' {} +
        echo "✅ নাম পরিবর্তন সম্পন্ন হয়েছে।"

    - name: ☕ 4. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: 🌐 5. Inject & Verify Gradle Wrapper Jar
      run: |
        echo "=================================================="
        echo "⚙️ গ্র্যাডল র‍্যাপার মেইন ক্লাস ইনজেক্ট করা হচ্ছে..."
        echo "=================================================="
        
        # রুট এবং অ্যান্ড্রয়েড ফোল্ডারে ম্যানুয়ালি ডিরেক্টরি তৈরি
        mkdir -p gradle/wrapper
        mkdir -p android/gradle/wrapper 2>/dev/null || true
        
        # ফ্রেশ জার ফাইল ডাউনলোড
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4/gradle/wrapper/gradle-wrapper.jar
        cp gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
        
        echo "🔍 জার ফাইলটি ঠিক জায়গায় বসেছে কিনা তা চেক করা হচ্ছে:"
        ls -l gradle/wrapper/gradle-wrapper.jar
        
        # গ্র্যাডল ফাইলগুলোকে এক্সিকিউট পারমিশন দেওয়া
        find . -name "gradlew" -exec chmod +x {} +
        echo "✅ পারমিশন এবং জার ইনজেকশন সফল!"

    - name: 🏗️ 6. Build Debug APK with Gradle (ফাইনাল রান)
      run: |
        echo "=================================================="
        echo "🚀 গ্র্যাডল কম্পাইলার চালু হচ্ছে... অ্যাপ বিল্ড শুরু!"
        echo "=================================================="
        
        if [ -f gradlew ]; then
          echo "🏃 রুট gradlew দিয়ে বিল্ড করা হচ্ছে..."
          ./gradlew assembleDebug --stacktrace
        elif [ -f android/gradlew ]; then
          echo "🏃 android ফোল্ডারের gradlew দিয়ে বিল্ড করা হচ্ছে..."
          cd android && ./gradlew assembleDebug --stacktrace
        else
          echo "🔍 অন্য ডিরেক্টরিতে gradlew খোঁজা হচ্ছে..."
          GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
          echo "📍 gradlew পাওয়া গেছে এখানে: $GRADLEW_PATH"
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug --stacktrace
        fi

    - name: 📦 7. Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Max-AI-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
