name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Unzip project
        run: |
          # গিটহাবে আপনার আপলোড করা নতুন ফাইনাল জিপ ফাইলটি আনজিপ করা হচ্ছে
          # যদি ফাইলে স্পেস থাকে তবে "Jarvis_AI_Fixed_Project_Final 2.zip" ব্যবহার করুন
          unzip -o "Jarvis_AI_Fixed_Project_Final 2.zip" -d extracted_project || unzip -o "Jarvis_AI_Fixed_Project_Final_2.zip" -d extracted_project
          REAL_ROOT=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_ROOT=$REAL_ROOT" >> $GITHUB_ENV

      - name: Enable AndroidX and Jetifier
        run: |
          cd "$PROJECT_ROOT/android"
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          flutter build apk --release

      - name: Move APK to Output
        run: |
          mkdir -p "$GITHUB_WORKSPACE/output_apk"
          cp "$PROJECT_ROOT/build/app/outputs/flutter-apk/app-release.apk" "$GITHUB_WORKSPACE/output_apk/Rayhan_ai_2.apk"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan_ai_2_APK
          path: output_apk/Rayhan_ai_2.apk
          if-no-files-found: error
