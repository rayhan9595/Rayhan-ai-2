name: Build and distribute

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Rayhan ai APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        working-directory: ./Jarvis-Ai
        run: flutter pub get

      - name: Build Android App
        working-directory: ./Jarvis-Ai
        run: flutter build apk --release

      - name: Rename APK to Rayhan ai
        working-directory: ./Jarvis-Ai
        run: |
          mkdir -p build/app/outputs/flutter-apk/
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rayhan_ai_2.apk || true

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-ai-2.APK
          path: Jarvis-Ai/build/app/outputs/flutter-apk/Rayhan_ai_2.apk
