name: Build Max AI - Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 1. Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: 📦 3. Unzip Project Safely
      run: |
        echo "📂 Jarvis_Sentinel_V4_Upgraded.zip আনজিপ করা হচ্ছে..."
        unzip -q Jarvis_Sentinel_V4_Upgraded.zip -d extracted_files
        
        # ফাইলগুলো যেখানেই থাকুক, জোর করে মেইন ডিরেক্টরিতে আনা হচ্ছে
        cp -r extracted_files/* . 2>/dev/null || true
        cp -r extracted_files/.* . 2>/dev/null || true
        
        # যদি সাবফোল্ডারে থাকে, সেখান থেকেও বের করা হচ্ছে
        if [ -d "Jarvis-Ai-main" ]; then
          cp -r Jarvis-Ai-main/* . 2>/dev/null || true
          cp -r Jarvis-Ai-main/.* . 2>/dev/null || true
        fi
        if [ -d "Jarvis-Ai" ]; then
          cp -r Jarvis-Ai/* . 2>/dev/null || true
          cp -r Jarvis-Ai/.* . 2>/dev/null || true
        fi
        rm -rf extracted_files
        
        echo "🔍 রুট ডিরেক্টরির ফাইল চেক করা হচ্ছে:"
        ls -la

    - name: 🏷️ 4. Rename App to Max AI
      run: |
        echo "🔄 অ্যাপের নাম পরিবর্তন করে Max AI করা হচ্ছে..."
        find . -name "strings.xml" -exec sed -i 's/Jarvis/Max AI/g' {} +
        find . -name "strings.xml" -exec sed -i 's/Jarvis-Ai/Max AI/g' {} +

    # 🔥 ৫. মেইন ফিক্স: জিপের ভেতরের ভাঙ্গা গ্র্যাডল বাদ দিয়ে গিটহাবের নিজস্ব গ্র্যাডল ইঞ্জিন দিয়ে সরাসরি বিল্ড করা
    - name: 🏗️ 5. Build Debug APK using System Gradle
      run: |
        echo "⚙️ সার্ভারের নিজস্ব গ্র্যাডল দিয়ে কম্পাইল করা হচ্ছে..."
        gradle assembleDebug --stacktrace

    - name: 📦 6. Upload Max AI APK
      uses: actions/upload-artifact@v4
      with:
        name: Max-AI-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
