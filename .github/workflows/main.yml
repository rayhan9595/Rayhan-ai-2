name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Unzip project
        run: |
          unzip -o "Jarvis_AI_Fixed_Project_3_Updated.zip" -d extracted_project
          REAL_ROOT=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_ROOT=$REAL_ROOT" >> $GITHUB_ENV
          echo "Found project root at: $REAL_ROOT"

      - name: Enable AndroidX and Jetifier
        run: |
          cd "$PROJECT_ROOT/android"
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Global AI Auto-Healing Code Fixer (Python)
        run: |
          cd "$PROJECT_ROOT"
          echo "Running global auto-repair for ALL dart files..."
          
          python3 -c '
          import os, re

          def fix_file_content(file_path):
              with open(file_path, "r", encoding="utf-8", errors="ignore") as f:
                  content = f.read()
              
              original = content
              
              # ১. গ্লোবাল ফিক্স: প্রজেক্টের যেকোনো ফাইলে কনস্ট্রাক্টর ছাড়া final ভ্যারিয়েবল থাকলে তার আগে late বসানো
              # এটি সমস্ত "Final field is not initialized" এরর চিরতরে বন্ধ করবে
              content = re.sub(r"(?<!late\s)final\s+([a-zA-Z0-9<>?_]+)\s+([a-zA-Z0-9_]+);", r"late final \1 \2;", content)
              
              # ২. ডবল জেনেরিক ব্র্যাকেট (<<) ফিক্স করা
              content = re.sub(r"<<\s*([a-zA-Z0-9_]+)\s*>", r"<\1>", content)
              content = content.replace("<<Database>", "<Database>")
              content = content.replace("<<AutomationState>", "<AutomationState>")
              content = content.replace("<<Application>", "<Application>")
              content = content.replace("<<WeatherData>", "<WeatherData>")
              
              # ৩. ভয়েস ব্লকের ভাঙা ক্লাস স্ট্রাকচার ফিক্স করা
              if "voice_bloc.dart" in file_path:
                  if "class StartListeningEvent" in content and "abstract class VoiceEvent" in content:
                      content = """import "package:flutter_bloc/flutter_bloc.dart";
          import "package:equatable/equatable.dart";

          abstract class VoiceEvent extends Equatable {
            const VoiceEvent();
            @override
            List<Object?> get props => [];
          }

          class StartListeningEvent extends VoiceEvent {}
          class StopListeningEvent extends VoiceEvent {}
          class ProcessVoiceEvent extends VoiceEvent {}

          abstract class VoiceState extends Equatable {
            const VoiceState();
            @override
            List<Object?> get props => [];
          }

          class VoiceInitial extends VoiceState {}
          class VoiceListening extends VoiceState {}
          class VoiceSuccess extends VoiceState {}
          class VoiceError extends VoiceState {}

          class VoiceBloc extends Bloc<VoiceEvent, VoiceState> {
            VoiceBloc() : super(VoiceInitial()) {
              on<StartListeningEvent>((event, emit) => emit(VoiceListening()));
              on<StopListeningEvent>((event, emit) => emit(VoiceInitial()));
              on<ProcessVoiceEvent>((event, emit) => emit(VoiceSuccess()));
            }
          }"""

              # ৪. ডাটাবেজ ফাইলের স্ট্রাকচার ফিক্স করা
              if "sqlite_db.dart" in file_path:
                  content = """import "package:sqflite/sqflite.dart";
          import "package:path/path.dart";

          class SQLiteDB {
            static final SQLiteDB _instance = SQLiteDB._internal();
            factory SQLiteDB() => _instance;
            SQLiteDB._internal();

            Database? _database;

            Future<Database> get database async {
              if (_database != null) return _database!;
              _database = await _initDB();
              return _database!;
            }

            Future<Database> _initDB() async {
              String path = join(await getDatabasesPath(), "jarvis_automation.db");
              return await openDatabase(path, version: 1, onCreate: _createDB);
            }

            Future<void> _createDB(Database db, int version) async {
              await db.execute(\"\"\"
                CREATE TABLE IF NOT EXISTS workflows (
                  id TEXT PRIMARY KEY,
                  name TEXT,
                  steps TEXT
                )
              \"\"\");
            }
          }"""

              if content != original:
                  with open(file_path, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Successfully healed: {file_path}")

          for root, dirs, files in os.walk("lib"):
              for file in files:
                  if file.endswith(".dart"):
                      fix_file_content(os.path.join(root, file))
          '

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          flutter build apk --release

      - name: Rename and Move APK
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p ../../output_apk/
          find build/app/outputs/flutter-apk/ -name "app-release.apk" -exec cp {} ../../output_apk/Rayhan_ai_2.apk \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan_ai_2_APK
          path: output_apk/Rayhan_ai_2.apk
          if-no-files-found: error
