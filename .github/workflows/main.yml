name: Rayhan AI - Auto Unzip & Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    name: Unzip & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ১. গিটহাব রিপোজিটরি থেকে জিপ ফাইল নেওয়া
      - uses: actions/checkout@v4

      # ২. জিপ ফাইল আনজিপ করা এবং ডাইনামিকলি রুট পাথ খুঁজে বের করা
      - name: Decompress and Locate Project Root
        run: |
          unzip -o Jarvis_AI_Final_Fixed4.zip
          
          if [ -d "root/jarvis_project" ]; then
            echo "DeepSeek structure detected. Moving files to root..."
            cp -r root/jarvis_project/* .
            cp -r root/jarvis_project/.[!.]* . 2>/dev/null || true
          elif [ -d "jarvis_project" ]; then
            cp -r jarvis_project/* .
            cp -r jarvis_project/.[!.]* . 2>/dev/null || true
          fi

      # 🛠️ ৩. smart_home.dart ফাইলের ভেতরের ভুল MQTT কোডটি অটো-ফিক্স করা
      - name: Auto-Fix MQTT Code Error
        run: |
          if [ -f "lib/services/iot/smart_home.dart" ]; then
            echo "Fixing smart_home.dart payload conversion..."
            # ভুল মেথডটিকে mqtt_client লাইব্রেরির সঠিক bytesToStringAsString মেথড দ্বারা রিপ্লেস করা হলো
            sed -i 's/pubMsg\.payload\.getPayloadAsString()/MqttPublishPayload.bytesToStringAsString(pubMsg.payload.message)/g' lib/services/iot/smart_home.dart
          fi

      # ৪. জাভা সেটআপ (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৫. ফ্লাটার সেটআপ (ভার্সন লক)
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      # ৬. অ্যান্ড্রয়েড এক্স কমপ্যাটিবিলিটি ফোর্স করা
      - name: Force AndroidX Compatibility
        run: |
          mkdir -p android
          echo "android.useAndroidX=true" >> android/gradle.properties
          echo "android.enableJetifier=true" >> android/gradle.properties

      # ৭. ডিপেন্ডেন্সি ডাউনলোড
      - name: Install dependencies
        run: |
          flutter pub get

      # 🚀 ৮. অ্যান্ড্রয়েড রিলিজ APK বিল্ড করা
      - name: Build release APK
        run: flutter build apk --release --split-per-abi --no-shrink

      # 📦 ৯. ফাইনাল APK আপলোড
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-AI-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
