name: Rayhan AI - Auto Unzip & Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-apk:
    name: Unzip & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ১. গিটহাব রিপোজিটরি থেকে জিপ ফাইলটি নেওয়া
      - uses: actions/checkout@v4

      # ২. লিনাক্স সার্ভারে আপনার জিপ ফাইলটি অটোমেটিক আনজিপ করা
      - name: Decompress Project Zip
        run: |
          unzip -o Jarvis_AI_Final_Fixed3.zip
          ls -la  # ফাইল ঠিকঠাক আনজিপ হয়েছে কিনা লগে দেখার জন্য

      # ৩. লেটেস্ট জাভা (JDK 17) সেটআপ করা
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৪. ফ্লাটারের লেটেস্ট স্টেবল ভার্সন সেটআপ করা
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ৫. ফ্লাটার ও গ্র্যাডেল ক্যাশ অন করা (যাতে দ্রুত বিল্ড হয়)
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: pub-${{ hashFiles('pubspec.yaml', 'pubspec.lock') }}
          restore-keys: pub-

      # ৬. প্রজেক্টের ডিপেন্ডেন্সি ইনস্টল করা
      - name: Install dependencies
        run: flutter pub get

      # 🔍 ঐচ্ছিক: কোডে কোনো বড় ভুল আছে কিনা চেক করা
      - name: Run Dart analyzer
        run: flutter analyze

      # ৭. অ্যান্ড্রয়েড রিলিজ APK বিল্ড করা
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # 📦 ৮. ফাইনাল APK ফাইলটি ডাউনলোডের জন্য রেডি করা
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-AI-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
