name: Flutter Build APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Unzip project
        run: |
          unzip -o "Jarvis_AI_Fixed_Project_3_Updated.zip" -d extracted_project
          REAL_ROOT=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
          echo "PROJECT_ROOT=$REAL_ROOT" >> $GITHUB_ENV
          echo "Found project root at: $REAL_ROOT"

      - name: Enable AndroidX and Jetifier
        run: |
          cd "$PROJECT_ROOT/android"
          touch gradle.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          echo "gradle.properties updated with AndroidX support!"

      - name: Pre-Build Code Fixer
        run: |
          cd "$PROJECT_ROOT"
          echo "Fixing double generic brackets across all files..."
          # সকল ডার্ট ফাইল থেকে ভুল ব্র্যাকেট ফরম্যাট (<<) ডাইনামিকালি ফিক্স করা হচ্ছে
          find lib/ -name "*.dart" -type f -exec sed -i 's/<<Database>/\<Database\>/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/<<AutomationState>/\<AutomationState\>/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/<<Application>/\<Application\>/g' {} +
          find lib/ -name "*.dart" -type f -exec sed -i 's/<<WeatherData>/\<WeatherData\>/g' {} +
          echo "Syntax cleanup completed!"

      - name: Install dependencies
        run: |
          cd "$PROJECT_ROOT"
          flutter pub get

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          # কোনো সিনট্যাক্স অ্যানালিটিক্স বা অ্যানোটেশন এররের জন্য যেন বিল্ড না আটকে যায়, তার জন্য ফোর্স রান
          flutter build apk --release --no-sound-null-safety || flutter build apk --release --no-validate-components

      - name: Rename and Move APK
        run: |
          cd "$PROJECT_ROOT"
          mkdir -p ../../output_apk/
          find build/app/outputs/flutter-apk/ -name "app-release.apk" -exec cp {} ../../output_apk/Rayhan_ai_2.apk \;
          echo "APK successfully copied and renamed!"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan_ai_2_APK
          path: output_apk/Rayhan_ai_2.apk
          if-no-files-found: error
