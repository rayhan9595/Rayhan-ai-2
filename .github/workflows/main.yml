name: Build Max AI - Native Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 🚀 1. Checkout Repository
      uses: actions/checkout@v4

    - name: ☕ 2. Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: 📦 3. Unzip Project Safely
      run: |
        echo "📂 Jarvis_Sentinel_V4_Upgraded.zip আনজিপ করা হচ্ছে..."
        unzip -q Jarvis_Sentinel_V4_Upgraded.zip -d extracted_files
        
        cp -r extracted_files/* . 2>/dev/null || true
        cp -r extracted_files/.* . 2>/dev/null || true
        
        if [ -d "Jarvis-Ai-main" ]; then
          cp -r Jarvis-Ai-main/* . 2>/dev/null || true
          cp -r Jarvis-Ai-main/.* . 2>/dev/null || true
        fi
        if [ -d "Jarvis-Ai" ]; then
          cp -r Jarvis-Ai/* . 2>/dev/null || true
          cp -r Jarvis-Ai/.* . 2>/dev/null || true
        fi
        rm -rf extracted_files

    - name: 🏷️ 4. Rename App to Max AI
      run: |
        echo "🔄 অ্যাপের নাম পরিবর্তন করে Max AI করা হচ্ছে..."
        find . -name "strings.xml" -exec sed -i 's/Jarvis/Max AI/g' {} +
        find . -name "strings.xml" -exec sed -i 's/Jarvis-Ai/Max AI/g' {} +

    # 🔥 ৫. চূড়ান্ত ফিক্স: গিটহাবের গ্র্যাডল ৯ বাদ দিয়ে অফিসিয়াল অ্যাকশন দিয়ে গ্র্যাডল ৮.৪ সেটআপ
    - name: 🛠️ 5. Setup Version Locked Gradle 8.4
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    # 🔥 ৬. বিল্ড কমান্ড (সরাসরি ফ্রেশ গ্র্যাডল ৮.৪ ইঞ্জিন দিয়ে রান হবে)
    - name: 🏗️ 6. Build Debug APK
      run: |
        echo "🚀 লকিং গ্র্যাডল ৮.৪ ইঞ্জিন দিয়ে বিল্ড শুরু হচ্ছে..."
        gradle assembleDebug --stacktrace

    - name: 📦 7. Upload Max AI APK
      uses: actions/upload-artifact@v4
      with:
        name: Max-AI-Debug-APK
        path: "**/build/outputs/apk/debug/*.apk"
