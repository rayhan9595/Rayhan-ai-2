name: Rayhan AI - Auto Unzip & Build APK

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Node.js এর ডেপ্রিকেশন ওয়ার্নিং ফিক্স করার জন্য

jobs:
  build-apk:
    name: Unzip & Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ১. রিপোজিটরি থেকে জিপ ফাইলটি নেওয়া
      - uses: actions/checkout@v4

      # ২. জিপ ফাইল আনজিপ করা এবং ডিরেক্টরি লেভেল চেক করা
      - name: Decompress Project Zip
        run: |
          unzip -o Jarvis_AI_Final_Fixed3.zip
          # যদি জিপ ফাইলটি কোনো ফোল্ডারের ভেতরে আনজিপ হয়ে থাকে, তবে ফাইলগুলোকে মেইন রুটে নিয়ে আসা
          if [ -d "jarvis_project" ]; then
            mv jarvis_project/* .
            mv jarvis_project/.[!.]* . 2>/dev/null || true
          fi
          ls -la # সার্ভারে ফাইলগুলো কেমন দেখায় তা চেক করার জন্য

      # ৩. জাভা সেটআপ (JDK 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ৪. ফ্লাটার সেটআপ
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # ৫. ডিপেন্ডেন্সি ডাউনলোড
      - name: Install dependencies
        run: |
          flutter pub cache clean -f
          flutter pub get

      # ৬. অ্যান্ড্রয়েড রিলিজ APK বিল্ড করা
      - name: Build release APK
        run: flutter build apk --release --split-per-abi

      # 📦 ৭. ফাইনাল APK আপলোড
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-AI-release-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
