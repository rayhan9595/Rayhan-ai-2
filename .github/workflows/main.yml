name: Build and distribute

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Rayhan ai APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Unzip Project File
        run: |
          unzip "Jarvis_AI_Complete_Project 2 .zip" -d extracted_project
          # ভেতরের ফোল্ডার স্ট্রাকচার চেক করার জন্য
          ls -R extracted_project

      - name: Install Dependencies
        run: |
          cd extracted_project/*
          flutter pub get

      - name: Build Android App
        run: |
          cd extracted_project/*
          flutter build apk --release

      - name: Rename APK to Rayhan ai
        run: |
          cd extracted_project/*
          mkdir -p build/app/outputs/flutter-apk/
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Rayhan_ai_2.apk || true

      - name: Archive APK
        uses: actions/upload-artifact@v4
        with:
          name: Rayhan-ai-2.APK
          path: extracted_project/**/build/app/outputs/flutter-apk/Rayhan_ai_2.apk
