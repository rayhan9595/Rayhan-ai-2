name: Build Max AI APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ১. প্রথমে জিপ ফাইলটি আনজিপ করে মেইন ডিরেক্টরিতে নিয়ে আসব
    - name: Unzip Upgraded Project
      run: |
        echo "📦 Unzipping Jarvis_Sentinel_V4_Upgraded.zip..."
        unzip -o Jarvis_Sentinel_V4_Upgraded.zip -d extracted_project
        
        # ফাইলগুলো ঠিক কোন লেভেলে আছে তা নিশ্চিত করতে মুভ করা
        if [ -d "extracted_project/Jarvis-Ai" ]; then
          mv extracted_project/Jarvis-Ai/* .
          mv extracted_project/Jarvis-Ai/.[!.]* . 2>/dev/null || true
        elif [ -d "extracted_project/Jarvis-Ai-main" ]; then
          mv extracted_project/Jarvis-Ai-main/* .
          mv extracted_project/Jarvis-Ai-main/.[!.]* . 2>/dev/null || true
        else
          mv extracted_project/* .
          mv extracted_project/.[!.]* . 2>/dev/null || true
        fi
        rm -rf extracted_project
        
        # অ্যাপের নাম পরিবর্তন করে "Max AI" করা
        echo "🏷️ Changing App Name to Max AI..."
        find . -name "strings.xml" -exec sed -i 's/Jarvis/Max AI/g' {} +
        find . -name "strings.xml" -exec sed -i 's/Jarvis-Ai/Max AI/g' {} +

    # ২. জাভা সেটআপ করব কিন্তু কোনো ক্যাশ খোঁজাখুঁজি করব না (যাতে এরর না আসে)
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    - name: Grant Execute Permission to Gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        else
          cd android && chmod +x gradlew && cd ..
        fi

    - name: Build Debug APK with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        } else
          cd android && ./gradlew assembleDebug --stacktrace
        fi

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Max-AI-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
