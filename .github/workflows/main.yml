name: Build Max AI APK from Zip

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # ১. জিপ ফাইল আনজিপ করা
    - name: Unzip Upgraded Project
      run: |
        echo "📦 Unzipping Jarvis_Sentinel_V4_Upgraded.zip..."
        unzip -o Jarvis_Sentinel_V4_Upgraded.zip -d extracted_project
        
        if [ -d "extracted_project/Jarvis-Ai" ]; then
          mv extracted_project/Jarvis-Ai/* .
          mv extracted_project/Jarvis-Ai/.[!.]* . 2>/dev/null || true
        elif [ -d "extracted_project/Jarvis-Ai-main" ]; then
          mv extracted_project/Jarvis-Ai-main/* .
          mv extracted_project/Jarvis-Ai-main/.[!.]* . 2>/dev/null || true
        else
          mv extracted_project/* .
          mv extracted_project/.[!.]* . 2>/dev/null || true
        fi
        rm -rf extracted_project
        
        # অ্যাপের নাম পরিবর্তন করে "Max AI" করা
        echo "🏷️ Changing App Name to Max AI..."
        find . -name "strings.xml" -exec sed -i 's/Jarvis/Max AI/g' {} +
        find . -name "strings.xml" -exec sed -i 's/Jarvis-Ai/Max AI/g' {} +

    # ২. জাভা সেটআপ
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'

    # 🔥 ৩. হারানো গ্র্যাডল র‍্যাপার জার ফাইল অটো-ডাউনলোড (মেইন ফিক্স)
    - name: Download Missing Gradle Wrapper Jar
      run: |
        mkdir -p gradle/wrapper
        echo "🌐 Downloading missing gradle-wrapper.jar..."
        curl -L -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4/gradle/wrapper/gradle-wrapper.jar

    # ৪. পারমিশন ঠিক করা
    - name: Grant Execute Permission to Gradlew
      run: |
        if [ -f gradlew ]; then
          chmod +x gradlew
        else
          cd android && chmod +x gradlew && cd ..
        fi

    # ৫. অ্যাপ বিল্ড করা
    - name: Build Debug APK with Gradle
      run: |
        if [ -f gradlew ]; then
          ./gradlew assembleDebug --stacktrace
        else
          cd android && ./gradlew assembleDebug --stacktrace
        fi

    # ৬. ফাইনাল এপিকে আপলোড
    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Max-AI-Debug-APK
        path: |
          **/build/outputs/apk/debug/*.apk
